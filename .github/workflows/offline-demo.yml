name: Offline backtest demo

on:
  push:
  pull_request:

jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-demo.txt
      - run: python -m pip install -r requirements-demo.txt
      - run: python main.py --mode synthetic --no-plot --json-out output/demo.json
