name: Raw market tests

on:
  push:
  pull_request:

jobs:
  raw-market:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: requirements-lock-py311.txt
      - name: Install locked Python 3.11 environment
        run: python -m pip install -r requirements-lock-py311.txt
      - name: Run offline raw-market and portability tests
        env:
          RUN_KLC_RUNTIME_SMOKE: "1"
        run: python -m unittest discover -s tests -p "test_*.py" -v
